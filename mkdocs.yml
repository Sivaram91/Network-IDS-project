site_name: Network IDS Project
site_description: ML-based Network Intrusion Detection System
site_author: Sivaramasubramanian Sundararaj
site_url: https://sivaram91.github.io/Network-IDS-project/

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow

extra_css:
  - helpers/css/custom.css
  - helpers/css/LessonsTable.css

extra_javascript:
  - https://unpkg.com/mermaid/dist/mermaid.min.js
  - helpers/js/toc_collapse.js
  - helpers/js/custom_glightbox_zoom.js

nav:
  - Home: index.md
  - Getting Started: General/getting_started.md
  - Tools Installation: General/tools_installation.md
  - System Engineering: 
    - System Requirements: Requirements/SystemRequirements.md
    - System Architecture: Architecture/SystemArchitecture.md
  - Software Engineering: 
    - Software Process: General/ASPICE_V_Model.md
    - Feature Tree: Architecture/FeatureTree.md
    - SWE1 - Software Requirements: Requirements/SwRequirements.md
    - SWE2 - Software Architecture: Architecture/SwArchitecture.md
    - SWE3 - Software Design:
      - Raspberry Pi: General/RaspPi_Comp_Design.md
      - STM32 Microcontroller: General/STM_Comp_Design.md
    - SWE4 - Unit Verification: TestDocs/SwUnitVerificationTestSpec.md
    - SWE5 - Software Integration Tests: TestDocs/SwIntegrationTestSpec.md
    - SWE6 - Software Validation Tests: TestDocs/SwQualificationTestSpec.md
  - Knowledge Base: KnowledgeBase/HomePage.md
  - Project Planning: General/Release_Planning.md
  - How-To: General/HowTos.md
  - Lessons Learnt: LessonsLearnt/00_LessonsLearnt.md
  - Glossary: General/Glossary.md
  - FAQs: General/FAQs.md
  - Dashboards:
    - Project Progress: Dashboards/ProjectProgress.md
    - Requirements Traceability: Dashboards/RequirementsTraceability.md
    - Test Coverage: Dashboards/TestCoverage.md
    - Code Quality: Dashboards/CodeQuality.md

plugins:
  - search
  - git-revision-date-localized:
      type: custom
      custom_format: "%d-%b-%Y"
      timezone: Europe/Berlin
      fallback_to_build_date: true
  - build_plantuml:
      render: 'server'  # Use server rendering to avoid local dependencies
      server: 'http://www.plantuml.com/plantuml'
      output_format: "svg"
      diagram_root: "docs/diagrams"
      output_folder: "out"
      input_folder: "src"
      input_extensions: "puml"
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
      auto_caption: false
      caption_position: bottom

markdown_extensions:
  - admonition
  - codehilite:
      guess_lang: false
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

docs_dir: docs

# Enable raw HTML/JavaScript in markdown
use_directory_urls: true
