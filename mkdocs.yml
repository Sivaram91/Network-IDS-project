site_name: Network IDS Project
site_description: ML-based Network Intrusion Detection System
site_author: Sivaramasubramanian Sundararaj
site_url: https://sivaram91.github.io/Network-IDS-project/

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.sections
    - navigation.indexes

extra:
  toc:
    visible: false

extra_css:
  - css/custom.css

extra_javascript:
  - https://unpkg.com/mermaid/dist/mermaid.min.js
  - js/toc_collapse.js

nav:
  - Home: index.md
  - Getting Started: getting_started.md
  - Tools Installation: tools_installation.md
  - System Engineering: 
    - System Requirements: Requirements/SystemRequirements.md
    - System Architecture: Architecture/SystemArchitecture.md
  - Software Engineering: 
    - Feature Tree: Architecture/FeatureTree.md
    - Software Architecture: Architecture/SwArchitecture.md
    - Software Requirements: Requirements/SwRequirements.md
    - Raspberry Pi: RaspPi_Comp_Design.md
    - STM32 Microcontroller: STM_Comp_Design.md
  - How-To: HowTos.md
  - Lessons Learnt: LessonsLearnt.md

plugins:
  - search
  - git-revision-date-localized:
      type: custom
      custom_format: "%d-%b-%Y"
      timezone: Europe/Berlin
      fallback_to_build_date: true
  # - build_plantuml:
  #    render: "local"  # Uses local rendering, no server needed
  #    bin_path: ""  # Leave empty, will auto-detect
  #    output_format: "svg"
  #    diagram_root: "docs/diagrams"
  #    output_folder: "out"
  #    input_folder: "src"
  #    input_extensions: "puml"

# Add this to ignore only .svg file warnings
validation:
  links:
    not_found: ignore

markdown_extensions:
  - admonition
  - codehilite:
      guess_lang: false
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

docs_dir: docs

# Enable raw HTML/JavaScript in markdown
use_directory_urls: true

extra_javascript:
  - https://unpkg.com/mermaid/dist/mermaid.min.js